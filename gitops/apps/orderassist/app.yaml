# orderassist: a voice ordering assistant — its core, its voice agent and its
# Square worker, released together as one chart. Wave 1, after its SealedSecrets at wave 0.
#
# The chart creates nothing it depends on. From this repository it needs:
# the Secrets in this directory, the ORDERASSIST account in
# ../../platform/nats.yaml, the database from terraform/platform, and the
# Gateway. See ../README.md, "orderassist".
#
# Its defaults are already this cluster's: the host orderassist.heptapedal.com,
# NATS at nats.nats.svc, and the Secret names sealed here. The published chart
# pins its images, so nothing here restates them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderassist
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/shogotsuneto/charts
    chart: orderassist
    # A release version, immutable (ADR 0011); dev versions are not deployed.
    targetRevision: 0.3.2
    helm:
      valuesObject:
        # Both images are private packages (ADR 0011).
        imagePullSecrets:
          - name: ghcr

        # Sends each confirmed order to Square's sandbox, as its own NATS user;
        # off in the chart by default.
        squareWorker:
          enabled: true

        # Traces, metadata only, to the metrics collector's OTLP receiver, which
        # forwards them to Grafana Cloud (ADR 0018); off in the chart by default.
        telemetry:
          otlpEndpoint: http://alloy-alloy-metrics.monitoring.svc:4318

        # Attaches to the shared Gateway; the host is a subdomain, so the
        # wildcard listener. /ws goes to the voice agent, everything else to the
        # core, on the one host.
        httpRoute:
          enabled: true
          parentRefs:
            - name: heptapedal
              namespace: gateway
              sectionName: https-wildcard
  destination:
    server: https://kubernetes.default.svc
    namespace: orderassist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
