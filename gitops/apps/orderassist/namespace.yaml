# Where orderassist runs (shogotsuneto/F26_4495_S2_ShogoT). Declared here, at
# wave -1, for the same reason as heptapedal's: its SealedSecrets are scheduled
# ahead of the Application and need the namespace first.
apiVersion: v1
kind: Namespace
metadata:
  name: orderassist
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
