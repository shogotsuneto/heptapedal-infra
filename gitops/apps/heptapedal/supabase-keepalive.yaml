# Keep the Supabase free project from idling into a pause.
#
# Free projects pause after a week without activity (ADR 0008). Authentication
# lives there, so a pause is a login outage — the site keeps serving pages and
# nobody can sign in.
#
# In the cluster rather than in GitHub Actions, for two reasons that both come
# down to not duplicating things:
#
#   * The credentials already exist here. `app-secrets` carries SUPABASE_URL and
#     SUPABASE_PUBLISHABLE_KEY for the application; a workflow would need a
#     second copy in repository secrets, and a rotation would then have two
#     places to reach. ADR 0007's rule is about a value having one home.
#   * Scheduled workflows are disabled after 60 days without repository activity
#     on a public repository — and this one is meant to become public (ADR 0012).
#     That failure chains quietly: workflow stops, project pauses, login breaks.
#
# What it costs: a failing CronJob is not emailed to anyone the way a failing
# workflow is. The Job's failure does reach Grafana already (kube-state-metrics
# is enabled), so what is missing is the alert rule — which is #23's work either
# way, since "alert if the ping fails" was never free.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: supabase-keepalive
  namespace: hepta
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Daily, not the weekly ADR 0008 first sketched: the window is seven days, and
  # a weekly job that slips leaves no margin. Off the hour out of habit.
  schedule: "17 6 * * *"
  timeZone: Etc/UTC

  # Without this, a CronJob that misses more than 100 windows stops scheduling
  # permanently and only says so in a controller event. At one run a day that is
  # a hundred days of downtime away — unlikely, and a silent, unrecoverable-
  # looking failure is exactly the kind this job exists to prevent.
  startingDeadlineSeconds: 3600

  concurrencyPolicy: Forbid
  # Keep failures around to be looked at; successes are noise.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      # The script already retries the request three times, so this is for
      # node-level trouble — an evicted pod — rather than a flaky network.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ping
              image: curlimages/curl:8.22.0
              env:
                - name: SUPABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: SUPABASE_URL
                - name: SUPABASE_PUBLISHABLE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: SUPABASE_PUBLISHABLE_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  # A row read through PostgREST, not /auth/v1/health: the
                  # documented rule is "sufficient user database activity", and
                  # the health endpoint answers from configuration without
                  # touching Postgres. It would prove the project responds while
                  # doing nothing about the thing that pauses it. A select
                  # cannot succeed without a query running.
                  url="${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1"

                  n=0
                  while :; do
                    n=$((n + 1))
                    if code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -m 30 \
                        -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" "$url"); then
                      break
                    fi
                    echo "attempt ${n} did not complete"
                    [ "$n" -ge 3 ] && { echo "could not reach Supabase after 3 attempts"; exit 1; }
                    sleep 20
                  done

                  echo "HTTP ${code}"
                  cat /tmp/body.json
                  echo

                  # The body above carries the detail: PostgREST reports a
                  # paused project, a missing table, a rotated key and a missing
                  # grant differently, and Postgres names the exact `grant` when
                  # that is what is wrong. Better than a guess written in
                  # advance — the first version of this message listed three
                  # causes and the real failure was a fourth.
                  [ "$code" = "200" ] || {
                    echo "Supabase returned ${code}; the body above says why. See docs/supabase-keepalive.md"
                    exit 1
                  }

                  # A 200 with `[]` means the query ran but returned nothing:
                  # the row or its RLS policy is gone. Treated as a failure,
                  # because otherwise the next seven days are not covered by
                  # what this job believes it did.
                  grep -q '"id"' /tmp/body.json || {
                    echo "query returned no rows — the keepalive row or its RLS policy is gone. See docs/supabase-keepalive.md"
                    exit 1
                  }

                  echo "Supabase answered a database query; the pause window is reset."
