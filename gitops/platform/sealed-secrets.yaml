# Sealed Secrets — the controller that lets encrypted Secrets live in this
# repository ([ADR 0007](../../docs/adr/0007-secrets-sealed-secrets.md)).
#
# Wave 0: everything after it that needs a credential — cert-manager's
# DigitalOcean token (#11), Alloy's Grafana Cloud token (#15), the GHCR
# registry credential (#10) — arrives as a SealedSecret, which is undecryptable
# until this controller is running.
#
# Installed into kube-system as `sealed-secrets-controller` because those are
# kubeseal's defaults, so `kubeseal` works with no flags at all. Deviating would
# mean every seal carrying --controller-namespace and --controller-name, and
# eventually one that forgets to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.3
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller

        # A small controller: it decrypts on admission and rotates a key every
        # 30 days. Nothing here scales with the number of secrets.
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
