# The shared Gateway: one entry point, and each application attaches its own
# HTTPRoute from its own namespace. That delegation is what Ingress never had
# and the reason ADR 0005 chose Gateway API.
#
# The implementation is DigitalOcean's, backed by Cilium and running before we
# deploy anything (ADR 0014). Nothing here installs a controller.
#
# Wave 4, after the certificate its HTTPS listeners serve.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: heptapedal
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Provided and managed by DOKS. `kubectl get gatewayclass` shows it Accepted
  # on a fresh cluster.
  gatewayClassName: cilium

  # Load balancer settings, capped by Gateway API at eight entries.
  infrastructure:
    annotations:
      # Identifies the 12 USD/month line on the bill.
      service.beta.kubernetes.io/do-loadbalancer-name: heptapedal

      # #14 asked for an idle-timeout annotation here. Removed, because it was
      # measured and it does nothing: DigitalOcean gives this Gateway a
      # REGIONAL_NETWORK balancer whose forwarding rules are `tcp 443 -> tcp
      # 443`, so there is no HTTP layer to hold an HTTP idle timeout, and the
      # API keeps reporting 60 however the annotation is set. The suspicion the
      # old comment recorded was correct.
      #
      # What the balancer does instead, measured by holding a connection open
      # and bisecting: it survives 130 seconds idle and is cut by 310 — almost
      # certainly the 300-second TCP flow timeout that is a common default.
      # That is not ours to configure, so an MCP session which goes quiet gets
      # dropped, and application-side keepalives are the only lever. Anything
      # under about two minutes is comfortably clear of it. See #14.

  listeners:
    # No hostname: it matches everything, and everything it matches is
    # redirected by the HTTPRoute below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # Two HTTPS listeners rather than one without a hostname, so the Gateway
    # serves this certificate for exactly the names it covers — the apex and one
    # label of subdomain — and not for arbitrary SNI.
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: heptapedal.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: heptapedal-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All

    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.heptapedal.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: heptapedal-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Gateway API has no listener-level redirect, so plain HTTP is answered by a
# route that does nothing but send the client to HTTPS. RequestRedirect is Core
# support, so any conformant implementation provides it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: heptapedal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
