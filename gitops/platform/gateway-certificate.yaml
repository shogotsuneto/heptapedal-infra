# The wildcard certificate the shared Gateway (#13) serves.
#
# Issued into the `gateway` namespace rather than alongside cert-manager because
# a Gateway's certificateRefs resolve in its own namespace: the Secret has to
# exist next to it. Issuing it at wave 3 also means #13 finds it already there
# rather than waiting on ACME while the Gateway reports unhealthy.
#
# The namespace itself is declared in namespaces.yaml, at wave -1.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: heptapedal-wildcard
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: heptapedal-wildcard-tls

  # Production, now that staging has issued this exact certificate — same DNS
  # names, same solver, same token. The staging issuer stays declared: it is
  # where to point anything whose issuance is not yet proven, since Let's
  # Encrypt counts failures against a limit of five duplicate certificates a
  # week.
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer

  commonName: heptapedal.com
  dnsNames:
    - heptapedal.com
    - "*.heptapedal.com"
