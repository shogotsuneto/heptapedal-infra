# Argo CD, trimmed for a two-node cluster with roughly 6Gi schedulable
# (ADR 0004). The chart's defaults assume more room than this platform has.

# No SSO: one operator, and Dex is a whole extra Deployment to run an identity
# broker for nobody.
dex:
  enabled: false

# Alerting goes through Grafana Cloud (ADR 0010), so the notifications
# controller would duplicate a system that already exists.
notifications:
  enabled: false

configs:
  params:
    # argocd-server serves plain HTTP. Reachable only through port-forward for
    # now; when it is exposed it will sit behind the Gateway, which terminates
    # TLS (ADR 0005). Nothing is downgraded — there is no path to it that is
    # not already inside the cluster.
    server.insecure: true

server:
  # Not exposed. Publishing the UI is a separate decision with its own
  # authentication question; until then, port-forward.
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Holds the cluster's resource cache, and does the applying — including
# server-side apply of the megabyte-scale Gateway API CRDs, which is CPU work
# under a request that was starving it.
controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# Renders every manifest, which is the heaviest work Argo CD does here — charts
# carrying megabytes of CRDs are routine.
#
# 50m was far too little. A CPU request is a share under contention, so the
# renders starved, health checks began taking seconds, the liveness probe
# failed, and the container was killed — 52 restarts, each exiting 0 after a
# graceful shutdown, so it read as "Completed" rather than as a crash. Syncs
# failed around it in ways that named neither CPU nor this container.
#
# No CPU limit deliberately: the request is a floor to win contention, and a
# limit would reintroduce throttling during exactly the render spikes this is
# sized for.
repoServer:
  # The chart's probes time out after 1 second. The liveness probe calls
  # /healthz?full=true, which does a gRPC self-check that measurably takes 1.1
  # to 1.7 seconds here — so a working repo-server gets killed, exits 0 through
  # a graceful shutdown, and reappears as `Completed` with a restart count
  # rather than as a crash. Each restart drops in-flight manifest generation,
  # which surfaces on the Application as `connection refused` to a port that is
  # simply not listening yet.
  #
  # More CPU did not fix it: the check exceeds a one-second budget on an idle
  # node. The probe was measuring something slower than its own timeout.
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5

  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      memory: 1Gi

# Installed unconditionally by chart 10.x — there is no top-level toggle. Left
# idle: ADR 0006 uses app-of-apps until the application count justifies
# generators. Sized as the near-idle process it is.
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi
