# Validate on pull request, apply on merge.
#
# CI does not plan. It planned `platform` and nothing else — `argocd` needs an
# administrator kubeconfig and `grafana` a second token, both of which the
# read-only plan environment existed to avoid — so the plan comment was a gate
# over a third of the infrastructure while reading like a gate over all of it.
# The reviewer plans locally instead, which covers every stack; see ADR 0015 and
# the root README.
#
# `terraform/bootstrap` is deliberately absent from apply too. It needs the
# full-access Spaces key, which is kept out of CI, and it is applied roughly
# once by hand.
#
# Excluding it also means CI cannot build the platform from nothing; the rebuild
# runbook (#24) does that by hand. What CI does handle is the ordering between
# the stacks it owns — argocd reads the cluster platform creates — which the
# apply job expresses as steps rather than a matrix. See the comment there.
name: terraform

on:
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
      - .tool-versions
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
      - .tool-versions

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: false

jobs:
  # One source of truth for the OpenTofu version: .tool-versions, which is also
  # what a local asdf/mise reads.
  version:
    runs-on: ubuntu-latest
    outputs:
      tofu: ${{ steps.read.outputs.tofu }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "tofu=$(awk '/^opentofu /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

  # Needs no credentials, so it is safe on a pull request from a fork — and it
  # covers every stack, including the two `plan` leaves out: bootstrap, which is
  # applied by hand, and argocd, whose plan would need cluster administrator
  # rights. `init -backend=false` skips the state backend, so this
  # catches syntax and provider-schema errors without touching anything.
  check:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.version.outputs.tofu }}
          tofu_wrapper: false

      - run: tofu fmt -check -recursive -diff terraform/

      - name: Validate every stack
        run: |
          for dir in terraform/*/; do
            echo "::group::${dir}"
            tofu -chdir="${dir}" init -backend=false -input=false >/dev/null
            tofu -chdir="${dir}" validate
            echo "::endgroup::"
          done

  apply:
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Write credentials, and main only. Protection rules — a required reviewer
    # between merge and apply — need a public repository on this plan, so for
    # now merging is what approves: the gate is the pull request and its plan
    # comment. The environment still earns its place by keeping these
    # credentials out of the pull-request job. Reviewer goes on with #28.
    environment: production
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.version.outputs.tofu }}
          tofu_wrapper: false

      # Steps, not a matrix. The stacks are a chain, not a set: argocd reads
      # the cluster platform creates. A matrix says "these are independent" —
      # it does not guarantee ordering, and with fail-fast disabled it would
      # apply argocd against a cluster whose own apply had just failed. Steps
      # run in file order and stop at the first failure, which is the behaviour
      # the dependency actually needs.
      #
      # A new stack is a new step, placed by what it depends on.

      - name: platform
        working-directory: terraform/platform
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve -lock-timeout=5m

      - name: argocd
        working-directory: terraform/argocd
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve -lock-timeout=5m

      # Last, and not because anything waits for it: this stack configures
      # Grafana Cloud and touches neither the cloud nor the cluster. Its
      # credentials are scoped to that and are set only on this step, so the
      # earlier ones cannot reach alerting even by accident.
      #
      # Like argocd, it is not planned on pull requests — that would need a
      # second, read-only Grafana token, and the same reasoning applies: it is
      # first planned by its own apply run, where the output is visible before
      # anything changes.
      - name: grafana
        working-directory: terraform/grafana
        env:
          GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
          # Synthetic Monitoring has its own API and its own token; the one
          # above does not reach it.
          GRAFANA_SM_ACCESS_TOKEN: ${{ secrets.GRAFANA_SM_ACCESS_TOKEN }}
          TF_VAR_grafana_stack_slug: ${{ vars.GRAFANA_STACK_SLUG }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve -lock-timeout=5m
