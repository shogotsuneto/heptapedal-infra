# Plan on pull request, apply on merge.
#
# Two things from ADR 0012 (the repository must be safe to make public) shape
# this workflow:
#
#   * The plan *artifact* never leaves the job. `-out` and `show -json` carry
#     every value unredacted, `sensitive` included, so nothing is handed between
#     jobs or uploaded. Merging re-plans rather than replaying a reviewed plan —
#     a small divergence traded for never persisting a credential-bearing file.
#   * Rendered plan text is public, and accepted as such. It is masked
#     best-effort before posting: hygiene, not a boundary.
#
# `terraform/bootstrap` is deliberately absent. It needs the full-access Spaces
# key, which is kept out of CI, and it is applied roughly once by hand.
#
# The stacks therefore have an ordering dependency CI does not express: argocd
# needs platform's cluster to exist. That only bites on a from-scratch build,
# which CI cannot do anyway with bootstrap excluded — the rebuild runbook (#24)
# applies them by hand in order.
name: terraform

on:
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
      - .github/scripts/plan-comment.sh
      - .tool-versions
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
      - .github/scripts/plan-comment.sh
      - .tool-versions

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: false

jobs:
  # One source of truth for the OpenTofu version: .tool-versions, which is also
  # what a local asdf/mise reads.
  version:
    runs-on: ubuntu-latest
    outputs:
      tofu: ${{ steps.read.outputs.tofu }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "tofu=$(awk '/^opentofu /{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

  # Needs no credentials, so it is safe on a pull request from a fork — and it
  # covers every stack, including the two `plan` leaves out: bootstrap, which is
  # applied by hand, and argocd, whose plan would need cluster administrator
  # rights. `init -backend=false` skips the state backend, so this
  # catches syntax and provider-schema errors without touching anything.
  check:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.version.outputs.tofu }}
          tofu_wrapper: false

      - run: tofu fmt -check -recursive -diff terraform/

      - name: Validate every stack
        run: |
          for dir in terraform/*/; do
            echo "::group::${dir}"
            tofu -chdir="${dir}" init -backend=false -input=false >/dev/null
            tofu -chdir="${dir}" validate
            echo "::endgroup::"
          done

  plan:
    needs: version
    # ADR 0012 clause 5: a workflow holding credentials never runs against a
    # fork's code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Read-only DigitalOcean token, read-only Spaces key. A workflow anyone can
    # trigger by opening a pull request should not hold credentials that can
    # change anything.
    #
    # `deployment: false` takes the environment for its secrets without
    # recording a deployment: planning is not deploying, and every pull request
    # logging one buries the entries that are.
    environment:
      name: plan
      deployment: false
    permissions:
      contents: read
      pull-requests: write
    # Only `platform`. Planning `argocd` would need `kubernetes:access_cluster`,
    # which returns an administrator kubeconfig — and this environment's whole
    # point is holding credentials that cannot change anything. `argocd` is
    # validated without credentials in `check`, and planned by its apply run.
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.version.outputs.tofu }}
          tofu_wrapper: false

      - run: tofu init -input=false
        working-directory: terraform/platform

      - run: tofu validate
        working-directory: terraform/platform

      # -lock=false is what lets the read-only Spaces key suffice: taking a lock
      # would mean writing a .tflock object. Safe — plan does not write state.
      - name: Plan
        id: plan
        working-directory: terraform/platform
        run: |
          set +e
          tofu plan -input=false -lock=false -no-color -detailed-exitcode > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: Comment
        working-directory: terraform/platform
        env:
          GH_TOKEN: ${{ github.token }}
          STACK: platform
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PR: ${{ github.event.pull_request.number }}
        run: "$GITHUB_WORKSPACE/.github/scripts/plan-comment.sh"

      - name: Fail if the plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Write credentials, and main only. Protection rules — a required reviewer
    # between merge and apply — need a public repository on this plan, so for
    # now merging is what approves: the gate is the pull request and its plan
    # comment. The environment still earns its place by keeping these
    # credentials out of the pull-request job. Reviewer goes on with #28.
    environment: production
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ needs.version.outputs.tofu }}
          tofu_wrapper: false

      # Steps, not a matrix. The stacks are a chain, not a set: argocd reads
      # the cluster platform creates. A matrix says "these are independent" —
      # it does not guarantee ordering, and with fail-fast disabled it would
      # apply argocd against a cluster whose own apply had just failed. Steps
      # run in file order and stop at the first failure, which is the behaviour
      # the dependency actually needs.
      #
      # A new stack is a new step, placed by what it depends on.

      - name: platform
        working-directory: terraform/platform
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve -lock-timeout=5m

      - name: argocd
        working-directory: terraform/argocd
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve -lock-timeout=5m
