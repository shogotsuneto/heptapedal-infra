# Keep the Supabase free project from idling into a pause.
#
# Free projects pause after a week without activity (ADR 0008). Auth lives
# there, so a pause is a login outage — the application keeps serving pages and
# nobody can sign in.
#
# What counts is **database** activity, not merely reaching the project: the
# documented rule is "sufficient user database activity", and `/auth/v1/health`
# answers from configuration without touching Postgres. So this queries a real
# row through PostgREST instead, which cannot succeed without a query running.
# The one-time setup is in docs/supabase-keepalive.md.
#
# The ping doubles as the check: a paused project fails the request, so there is
# no separate probe to keep honest.
name: supabase-keepalive

on:
  schedule:
    # Daily rather than the weekly ADR 0008 first sketched. The window is seven
    # days, and a weekly job that slips — GitHub delays scheduled runs under
    # load — has no margin at all. Off the hour, which is when the schedulers
    # are busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the keepalive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?}" "${SUPABASE_PUBLISHABLE_KEY:?}"

          url="${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1"

          # Three attempts, because a single network blip should not read as a
          # paused project — the whole value of this job is that a failure means
          # something.
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.json -w '%{http_code}' -m 30 \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              "$url") && break || true
            echo "attempt ${attempt} failed to complete"
            [ "$attempt" = 3 ] && { echo "::error::could not reach Supabase after 3 attempts"; exit 1; }
            sleep 20
          done

          echo "HTTP ${code}"
          cat body.json

          if [ "$code" != "200" ]; then
            echo "::error::Supabase returned ${code}. A paused project, a missing" \
                 "keepalive table, or a rotated key — see docs/supabase-keepalive.md"
            exit 1
          fi

          # A 200 with `[]` means the query ran but returned nothing, which is
          # what a dropped row or a removed RLS policy looks like. The point is
          # to prove a query happened, so an empty result is a failure: it means
          # the next seven days are not covered by what this job thinks it did.
          if ! grep -q '"id"' body.json; then
            echo "::error::query returned no rows — the keepalive row or its RLS" \
                 "policy is gone; see docs/supabase-keepalive.md"
            exit 1
          fi

          echo "Supabase answered a database query; the pause window is reset."
