# Propose the version bumps this repository pins.
#
# Everything here is pinned on purpose — chart versions, provider constraints,
# action versions, the OpenTofu release. Pinning without something proposing the
# bump is not caution, it is falling behind quietly.
#
# Run here rather than through the hosted app, unlike the Supabase keepalive
# which went the other way. The difference is what a missed run costs. A missed
# keepalive is a login outage a few days later, so it belongs somewhere that
# does not stop; a missed bump is a week of not hearing about a patch release.
# And a bump is a change *to this repository*, which makes the repository the
# natural place for the thing that proposes it — where the keepalive suggested
# nothing and merely had to keep happening.
#
# The cost of that choice is the 60-day rule: scheduled workflows are disabled
# after 60 days without repository activity on a public repository, and this one
# is meant to become public. Renovate opening pull requests is itself activity,
# so it mostly sustains itself — but a quiet quarter would stop it, and nothing
# would say so. `workflow_dispatch` is the manual way back.
name: renovate

on:
  schedule:
    # Weekly. Pins here rot over months, and a bot that opens something every
    # morning is a bot people stop reading.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

# Renovate opens branches and pull requests as this repository's own token, so
# the job needs to write both. Nothing here reaches infrastructure.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.2.6
        env:
          # GITHUB_TOKEN, which costs a click per pull request rather than a
          # long-lived credential.
          #
          # Events raised by GITHUB_TOKEN generally start no workflow, to stop
          # a workflow triggering itself. Pull requests are the documented
          # exception: `opened`, `synchronize` and `reopened` do create runs,
          # held in an **approval-required** state until someone with write
          # access selects "Approve workflows to run". So `check` runs on
          # Renovate's pull requests — after a deliberate click.
          #
          # That click is the trade. A personal access token would remove it
          # and add a credential with contents and pull-requests write to keep
          # and rotate; this repository has consistently preferred fewer
          # credentials, and "awaiting approval" is a visible state rather than
          # a silently missing check.
          #
          # Two limitations, both accepted rather than discovered later.
          #
          # It cannot write .github/workflows/, and no permission exists to let
          # it — there is no `workflows` scope. Action versions are therefore
          # listed on the dependency dashboard and bumped by hand; see the
          # github-actions rule in renovate.json5, which also explains what
          # ticking one of those checkboxes would actually do.
          #
          # And scoped to this repository, it cannot always fetch release notes
          # from the projects it bumps, so pull request bodies are thinner.
          # GITHUB_COM_TOKEN would restore that, at the cost of the credential
          # this avoids.
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
